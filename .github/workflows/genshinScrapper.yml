name: Genshin Banner Scraper and Predictor

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite la ejecución manual desde la interfaz de GitHub

jobs:
  scrape-and-predict:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper and Prediction Script
      run: python genshinPY.py

    - name: Commit and Push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add banners_history.json rerun_predictions.json
        # Solo hacer commit si hay cambios reales en los archivos generados
        git diff --quiet && git diff --staged --quiet || git commit -m "Actualiza historial de banners y predicciones de reruns"
        git push